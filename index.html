<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Trader Pro AI PREMIUM</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #020617; --card: #0f172a; --input: #1e293b; --text: #f8fafc;
            --accent: #3b82f6; --green: #10b981; --red: #ef4444; --border: rgba(255,255,255,0.1);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); transition: 0.3s; }
        .navbar { background: var(--card); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
        .container { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.2rem; }
        .card { background: var(--card); border-radius: 1.2rem; padding: 1.5rem; border: 1px solid var(--border); }
        input, select, textarea { width: 100%; padding: 0.75rem; margin: 0.5rem 0 1rem; border-radius: 0.6rem; background: var(--input); color: var(--text); border: 1px solid var(--border); outline: none; font-size: 0.9rem; }
        button { padding: 0.75rem; border-radius: 0.6rem; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 0.5rem; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--green); color: white; }
        .btn-danger { background: var(--red); color: white; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-top: 1rem; }
        .stat-item { background: rgba(59, 130, 246, 0.05); padding: 1rem; border-radius: 0.8rem; border: 1px solid var(--border); text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: 700; color: var(--accent); display: block; }
        .trade-card { background: rgba(255,255,255,0.02); border-radius: 0.8rem; padding: 1rem; margin-top: 1rem; border-left: 4px solid var(--accent); font-size: 0.85rem; }
        .win-border { border-left-color: var(--green); }
        .loss-border { border-left-color: var(--red); }
        .broker-box { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
        .broker-link { text-decoration: none; padding: 0.7rem; border-radius: 0.6rem; text-align: center; font-weight: 700; color: white; font-size: 0.8rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-weight: 800; color: var(--accent);">FC TRADER PRO</div>
        <button id="logoutBtn" onclick="logout()" class="btn-danger hidden" style="width: auto; padding: 0.4rem 0.8rem;">Exit</button>
    </nav>

    <!-- Login -->
    <div id="loginPage" class="container">
        <div class="card" style="grid-column: 1 / -1; max-width: 400px; margin: 4rem auto;">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Trading Portal</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()" class="btn-primary">Login</button>
            <button onclick="signup()" style="background:transparent; color:var(--accent); border:1px solid var(--accent); margin-top:10px;">Sign Up Lokal</button>
        </div>
    </div>

    <!-- App -->
    <div id="appPage" class="hidden">
        <div class="container">
            
            <div class="card">
                <h3>💰 Modal & Currency</h3>
                <select id="currency" onchange="loadDashboard()">
                    <option value="USD">Currency: USD ($)</option>
                    <option value="IDR">Currency: IDR (Rp)</option>
                </select>
                <input type="number" id="startBalance" placeholder="Input Modal Awal">
                <button onclick="saveBalance()" class="btn-primary">Set Modal</button>
                <div class="stat-grid">
                    <div class="stat-item"><span>Equity</span><span class="stat-val" id="val-balance">0</span></div>
                    <div class="stat-item"><span>Winrate</span><span class="stat-val" id="val-wr">0%</span></div>
                </div>
            </div>

            <div class="card">
                <h3>📝 Trading Journal</h3>
                <input type="hidden" id="editIndex">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <input type="datetime-local" id="datetime">
                    <select id="asset">
                        <option value="XAUUSD">XAUUSD (Gold)</option>
                        <option value="Crypto">Crypto Asset</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                    <input type="number" id="entry" placeholder="Entry">
                    <input type="number" id="sl" placeholder="SL">
                    <input type="number" id="tp" placeholder="TP">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <select id="result">
                        <option value="Win">Win ✅</option>
                        <option value="Loss">Loss ❌</option>
                    </select>
                    <input type="number" id="profit" placeholder="P/L (+/-)">
                </div>
                <button onclick="saveTrade()" class="btn-success">Simpan Trade</button>
            </div>

            <div class="card">
                <h3>📈 Performance Chart</h3>
                <canvas id="equityChart"></canvas>
            </div>

            <div class="card">
                <h3>🔗 Official Links</h3>
                <div class="broker-box">
                    <a href="https://ma.valetax-indonesia.com/p/7322040" target="_blank" class="broker-link" style="background: #b45309;">Gold Broker (XAU)</a>
                    <a href="https://www.bmwweb.biz/register?ref=TRADEFC" target="_blank" class="broker-link" style="background: #1d4ed8;">Crypto Broker</a>
                    <a href="https://discord.gg/J7ucEJgYf" target="_blank" class="broker-link" style="background: #5865F2;">Discord Community</a>
                </div>
                <button onclick="exportData()" style="background:rgba(255,255,255,0.1); font-size: 10px; margin-top: 15px;">BACKUP DATA (JSON)</button>
            </div>

            <div class="card" style="grid-column: 1 / -1;">
                <h3>📜 History Trading</h3>
                <div id="tradeHistory" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem;"></div>
            </div>

        </div>
    </div>

    <script>
        let currentUser = "";
        let equityChart;

        function signup() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(!email || !pass) return alert("Isi semua data!");
            let users = JSON.parse(localStorage.getItem('fc_users')) || [];
            if(users.some(u => u.email === email)) return alert("User sudah ada!");
            users.push({email, pass});
            localStorage.setItem('fc_users', JSON.stringify(users));
            alert("Berhasil Daftar!");
        }

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const users = JSON.parse(localStorage.getItem('fc_users')) || [];
            if(users.some(u => u.email === email && u.pass === pass)) {
                currentUser = email;
                localStorage.setItem('fc_session', email);
                initApp();
            } else { alert("Login Salah!"); }
        }

        function initApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            loadDashboard();
        }

        function logout() { localStorage.removeItem('fc_session'); location.reload(); }

        function saveBalance() {
            localStorage.setItem(`bal_${currentUser}`, document.getElementById('startBalance').value);
            loadDashboard();
        }

        function saveTrade() {
            const trade = {
                dt: document.getElementById('datetime').value,
                ast: document.getElementById('asset').value,
                en: document.getElementById('entry').value,
                sl: document.getElementById('sl').value,
                tp: document.getElementById('tp').value,
                res: document.getElementById('result').value,
                pl: parseFloat(document.getElementById('profit').value) || 0
            };
            let trades = JSON.parse(localStorage.getItem(`trades_${currentUser}`)) || [];
            trades.push(trade);
            localStorage.setItem(`trades_${currentUser}`, JSON.stringify(trades));
            loadDashboard();
        }

        function loadDashboard() {
            const trades = JSON.parse(localStorage.getItem(`trades_${currentUser}`)) || [];
            const startBal = parseFloat(localStorage.getItem(`bal_${currentUser}`)) || 0;
            const curr = document.getElementById('currency').value;
            const sym = curr === "USD" ? "$" : "Rp";

            let currentBal = startBal;
            let wins = 0;
            let pts = [startBal];
            let html = "";

            trades.forEach((t, i) => {
                currentBal += t.pl;
                pts.push(currentBal);
                if(t.res === "Win") wins++;
                html += `
                    <div class="trade-card ${t.res === 'Win' ? 'win-border' : 'loss-border'}">
                        <strong>${t.ast}</strong> | <small>${t.dt.replace('T', ' ')}</small><br>
                        E: ${t.en} | SL: ${t.sl} | TP: ${t.tp}<br>
                        <span style="color:${t.res === 'Win' ? '#10b981' : '#ef4444'}">P/L: ${sym}${t.pl} (${t.res})</span>
                    </div>`;
            });

            document.getElementById('val-balance').innerText = sym + currentBal.toLocaleString();
            document.getElementById('val-wr').innerText = trades.length ? ((wins/trades.length)*100).toFixed(1) + '%' : '0%';
            document.getElementById('tradeHistory').innerHTML = html;
            drawChart(pts);
        }

        function drawChart(data) {
            const ctx = document.getElementById('equityChart').getContext('2d');
            if(equityChart) equityChart.destroy();
            equityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map((_, i) => i),
                    datasets: [{ data: data, borderColor: '#3b82f6', fill: false, tension: 0.3 }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }

        function exportData() {
            const data = localStorage.getItem(`trades_${currentUser}`);
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup_${currentUser}.json`;
            a.click();
        }

        window.onload = () => {
            const session = localStorage.getItem('fc_session');
            if(session) { currentUser = session; initApp(); }
        };
    </script>
</body>
</html>
