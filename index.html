<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Trader Pro AI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#020617;
color:white;
}

.topbar{
background:#111827;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
position:sticky;
top:0;
z-index:999;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

input,
select,
textarea{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#334155;
color:white;
font-size:16px;
}

textarea{
min-height:100px;
resize:none;
}

button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:14px;
background:#22c55e;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.deleteBtn{
background:#ef4444;
}

.blueBtn{
background:#3b82f6;
}

.stat{
margin-top:10px;
font-size:18px;
}

.tradeItem{
background:#111827;
padding:14px;
border-radius:14px;
margin-top:12px;
line-height:1.8;
}

.win{
color:#22c55e;
font-weight:bold;
}

.loss{
color:#ef4444;
font-weight:bold;
}

canvas{
background:white;
border-radius:14px;
margin-top:20px;
padding:10px;
}

.aiBox{
background:#111827;
padding:15px;
border-radius:14px;
line-height:1.8;
margin-top:15px;
}

img{
width:100%;
margin-top:10px;
border-radius:12px;
}

.hidden{
display:none;
}

.footer{
text-align:center;
margin-top:30px;
opacity:0.7;
padding-bottom:40px;
}

</style>
</head>

<body>

<div class="topbar">
FC Trader Pro AI
</div>

<div class="container">

<!-- LOGIN -->

<div id="loginPage">

<div class="card">

<h2 style="text-align:center;">
Login Trader
</h2>

<input id="email" placeholder="Email">

<input id="password"
type="password"
placeholder="Password">

<button onclick="login()">
LOGIN
</button>

<button onclick="register()">
REGISTER
</button>

</div>

</div>

<!-- APP -->

<div id="appPage" class="hidden">

<!-- DASHBOARD -->

<div class="card">

<h2>Trading Dashboard</h2>

<input id="startBalance"
type="number"
placeholder="Masukkan Modal Awal">

<button class="blueBtn"
onclick="saveBalance()">

SAVE MODAL

</button>

<div class="stat"
id="balance">

Balance : $0

</div>

<div class="stat"
id="profitStat">

Total Profit : $0

</div>

<div class="stat"
id="winrate">

Winrate : 0%

</div>

<div class="stat"
id="total">

Total Trade : 0

</div>

</div>

<!-- SAVE TRADE -->

<div class="card">

<h2>Save Trading</h2>

<input type="date" id="date">

<input id="pair"
placeholder="Pair">

<input id="entry"
type="number"
placeholder="Entry">

<input id="sl"
type="number"
placeholder="Stop Loss">

<input id="tp"
type="number"
placeholder="Take Profit">

<select id="result">

<option>Win</option>
<option>Loss</option>

</select>

<input id="profit"
type="number"
placeholder="Profit / Loss">

<textarea id="note"
placeholder="Catatan Trading...">
</textarea>

<input type="file"
id="image">

<button onclick="saveTrade()">
SAVE TRADE
</button>

</div>

<!-- CHART -->

<div class="card">

<h2>Equity Curve</h2>

<canvas id="equityChart"></canvas>

</div>

<div class="card">

<h2>Win vs Loss</h2>

<canvas id="pieChart"></canvas>

</div>

<!-- AI -->

<div class="card">

<h2>AI Trading Analysis</h2>

<div class="aiBox"
id="aiBox">

Waiting analysis...

</div>

<button onclick="runAI()">
RUN AI ANALYSIS
</button>

</div>

<!-- HISTORY -->

<div class="card">

<h2>Trade History</h2>

<div id="tradeHistory"></div>

</div>

<!-- PDF -->

<div class="card">

<button class="blueBtn"
onclick="downloadPDF()">

EXPORT PDF REPORT

</button>

<button class="deleteBtn"
onclick="resetAll()">

RESET ALL DATA

</button>

</div>

<div class="footer">
FC Trader Pro AI © 2026
</div>

</div>

</div>

<script>

let equityChart;
let pieChart;

/* ======================
REGISTER
====================== */

function register(){

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

if(email == "" || password == ""){

alert("Isi email dan password");

return;

}

localStorage.setItem(
"userEmail",
email
);

localStorage.setItem(
"userPassword",
password
);

alert("Register berhasil");

}

/* ======================
LOGIN
====================== */

function login(){

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

let savedEmail =
localStorage.getItem("userEmail");

let savedPassword =
localStorage.getItem("userPassword");

if(
email == savedEmail &&
password == savedPassword
){

document.getElementById(
"loginPage"
).classList.add("hidden");

document.getElementById(
"appPage"
).classList.remove("hidden");

loadDashboard();

}else{

alert("Login gagal");

}

}

/* ======================
SAVE BALANCE
====================== */

function saveBalance(){

let balance =
Number(
document.getElementById(
"startBalance"
).value
);

if(balance <= 0){

alert("Masukkan modal awal");

return;

}

localStorage.setItem(
"startBalance",
balance
);

alert("Modal berhasil disimpan");

loadDashboard();

}

/* ======================
SAVE TRADE
====================== */

function saveTrade(){

let date =
document.getElementById("date").value;

let pair =
document.getElementById("pair").value;

let entry =
Number(
document.getElementById("entry").value
);

let sl =
Number(
document.getElementById("sl").value
);

let tp =
Number(
document.getElementById("tp").value
);

let result =
document.getElementById("result").value;

let profit =
Number(
document.getElementById("profit").value
);

let note =
document.getElementById("note").value;

if(pair == "" || entry == ""){

alert("Isi data trading");

return;

}

let rr = 0;

if(entry != sl){

rr = (
Math.abs(tp - entry)
/
Math.abs(entry - sl)
).toFixed(2);

}

let trades =
JSON.parse(
localStorage.getItem("trades")
) || [];

let imageInput =
document.getElementById("image");

let imageUrl = "";

if(imageInput.files[0]){

imageUrl =
URL.createObjectURL(
imageInput.files[0]
);

}

trades.push({

date,
pair,
entry,
sl,
tp,
rr,
result,
profit,
note,
image:imageUrl

});

localStorage.setItem(
"trades",
JSON.stringify(trades)
);

alert("Trade berhasil disimpan");

clearForm();

loadDashboard();

}

/* ======================
CLEAR FORM
====================== */

function clearForm(){

document.getElementById("date").value = "";
document.getElementById("pair").value = "";
document.getElementById("entry").value = "";
document.getElementById("sl").value = "";
document.getElementById("tp").value = "";
document.getElementById("profit").value = "";
document.getElementById("note").value = "";
document.getElementById("image").value = "";

}

/* ======================
DELETE TRADE
====================== */

function deleteTrade(index){

let trades =
JSON.parse(
localStorage.getItem("trades")
) || [];

trades.splice(index,1);

localStorage.setItem(
"trades",
JSON.stringify(trades)
);

loadDashboard();

}

/* ======================
RESET ALL
====================== */

function resetAll(){

let yes =
confirm(
"Yakin hapus semua data?"
);

if(yes){

localStorage.removeItem("trades");

loadDashboard();

alert("Semua data dihapus");

}

}

/* ======================
LOAD DASHBOARD
====================== */

function loadDashboard(){

let trades =
JSON.parse(
localStorage.getItem("trades")
) || [];

let startBalance =
Number(
localStorage.getItem(
"startBalance"
)
) || 0;

let balance = startBalance;

let total = trades.length;

let win = 0;
let loss = 0;

let balanceData = [];

let historyHTML = "";

trades.forEach((t,i)=>{

balance += Number(t.profit);

balanceData.push(balance);

if(t.result == "Win"){
win++;
}else{
loss++;
}

historyHTML += `

<div class="tradeItem">

<b>${t.pair}</b><br>

Tanggal : ${t.date}<br>

Entry : ${t.entry}<br>

SL : ${t.sl}<br>

TP : ${t.tp}<br>

RR : 1:${t.rr}<br>

Result :
<span class="${
t.result == 'Win'
?
'win'
:
'loss'
}">
${t.result}
</span><br>

Profit : $${t.profit}<br>

Catatan : ${t.note}<br>

${t.image ?
`<img src="${t.image}">`
:
""
}

<button class="deleteBtn"
onclick="deleteTrade(${i})">

DELETE TRADE

</button>

</div>

`;

});

let winrate = 0;

if(total > 0){

winrate =
((win / total) * 100)
.toFixed(1);

}

document.getElementById(
"balance"
).innerHTML =
"Balance : $" +
balance.toFixed(2);

document.getElementById(
"profitStat"
).innerHTML =
"Total Profit : $" +
(balance - startBalance)
.toFixed(2);

document.getElementById(
"winrate"
).innerHTML =
"Winrate : " +
winrate + "%";

document.getElementById(
"total"
).innerHTML =
"Total Trade : " +
total;

document.getElementById(
"tradeHistory"
).innerHTML =
historyHTML;

loadCharts(
balanceData,
win,
loss
);

}

/* ======================
CHART
====================== */

function loadCharts(
balanceData,
win,
loss
){

const ctx1 =
document.getElementById(
"equityChart"
);

if(equityChart){
equityChart.destroy();
}

equityChart = new Chart(ctx1,{

type:'line',

data:{
labels:
balanceData.map(
(x,i)=>"T"+(i+1)
),

datasets:[{

label:'Equity',
data:balanceData,
tension:0.4

}]

}

});

const ctx2 =
document.getElementById(
"pieChart"
);

if(pieChart){
pieChart.destroy();
}

pieChart = new Chart(ctx2,{

type:'pie',

data:{
labels:['Win','Loss'],
datasets:[{
data:[win,loss]
}]
}

});

}

/* ======================
AI ANALYSIS
====================== */

function runAI(){

let trades =
JSON.parse(
localStorage.getItem("trades")
) || [];

let total =
trades.length;

let win = 0;

let totalProfit = 0;

trades.forEach(t=>{

if(t.result == "Win"){
win++;
}

totalProfit +=
Number(t.profit);

});

let winrate = 0;

if(total > 0){

winrate =
(win / total) * 100;

}

let result = "";

if(total == 0){

result =
"Belum ada data trading.";

}
else if(winrate >= 70){

result = `

🔥 Trading sangat bagus.<br><br>

✅ Konsisten profit<br>
✅ Psikologi trading stabil<br>
✅ Risk management baik<br><br>

Tetap fokus pada setup terbaik.

`;

}
else if(winrate >= 50){

result = `

📈 Trading cukup stabil.<br><br>

⚠️ Masih perlu meningkatkan entry<br>
⚠️ Hindari entry karena emosi<br><br>

Fokus pada disiplin trading.

`;

}
else{

result = `

⚠️ Trading masih lemah.<br><br>

❌ Entry belum konsisten<br>
❌ Risk management kurang baik<br>
❌ Kemungkinan overtrading<br><br>

Kurangi trading random.

`;

}

result += `

<hr style="margin:15px 0;">

📊 Total Trade :
${total}<br>

🏆 Winrate :
${winrate.toFixed(1)}%<br>

💰 Total Profit :
$${totalProfit}

`;

document.getElementById(
"aiBox"
).innerHTML = result;

}

/* ======================
PDF
====================== */

async function downloadPDF(){

const { jsPDF } =
window.jspdf;

let pdf =
new jsPDF();

pdf.text(
"FC Trader Pro AI",
20,
20
);

let trades =
JSON.parse(
localStorage.getItem("trades")
) || [];

let y = 40;

trades.forEach((t,i)=>{

pdf.text(

`${i+1}. ${t.date} | ${t.pair} | ${t.result} | RR 1:${t.rr} | Profit $${t.profit}`,

20,

y

);

y += 10;

});

pdf.save(
"FC-Trader-Report.pdf"
);

}

/* ======================
AUTO LOGIN
====================== */

window.onload = function(){

document.getElementById(
"startBalance"
).value =
localStorage.getItem(
"startBalance"
) || "";

if(
localStorage.getItem(
"userEmail"
)
){

document.getElementById(
"loginPage"
).classList.add("hidden");

document.getElementById(
"appPage"
).classList.remove("hidden");

loadDashboard();

}

}

</script>

</body>
</html>
